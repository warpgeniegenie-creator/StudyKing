<style>

.s1{--c:#c4623a;--d:#a24c2a}.s2{--c:#e0893a;--d:#b8691f}.s3{--c:#7fae3a;--d:#5b8526}.s4{--c:#2fa6a0;--d:#1f7f7a}.s5{--c:#4a86d8;--d:#3563a8}.s6{--c:#8e6bd1;--d:#6a4aa8}.s7{--c:#d65f9b;--d:#a8437a}.s8{--c:#d94b4b;--d:#a63333}.s9{--c:#9aa7b4;--d:#6f7c89}.s10{--c:#f2b705;--d:#c48f00}
#castle{display:block;height:112px;padding:2px 96px 0 6px;background:var(--s2)}
#castle svg{width:100%;height:100%;display:block}
#ctl{display:flex;gap:8px;padding:4px 10px 0;background:var(--s2)}

.cf{position:fixed;top:-30px;font-size:24px;animation:fall linear infinite;pointer-events:none;z-index:10}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
#castle{position:relative}

#mon.walk{animation:walkin 1.6s ease-out}

.mm{position:absolute;inset:0;font-size:38px;line-height:44px;text-align:center;animation:hop .35s infinite alternate}

@keyframes hop{to{transform:translateY(-4px)}}
@keyframes walkin{from{transform:translateX(52px) scale(.3);opacity:0}30%{opacity:1}to{transform:translateX(0) scale(1);opacity:1}}

@keyframes blink{to{background:#6e1d14}}
.tab{position:absolute;left:50%;top:16%;font-size:32px;font-weight:900;color:#c0392b;text-shadow:0 2px 0 #fff,0 0 12px #fff;animation:tab 1.8s forwards;pointer-events:none;white-space:nowrap;z-index:6}

#pbtn.gn{animation:gn .6s}

#disp.q{font-size:22px}
/* 벽돌 성 */
.k .f{fill:var(--c)}.k.tw .f{fill:#1b1209}.k.tg .f{fill:#2a190d}
.k path{fill:none;stroke:var(--d);stroke-width:.7}.k.tw path,.k.tg path{stroke:#3a2a1a}

.k.pp{animation:kpop .45s}@keyframes kpop{from{opacity:0;transform:translateY(-10px)}}
.k.cr{animation:kshake .38s}@keyframes kshake{25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.flag .fp{stroke:#6b4a2f;stroke-width:1.6}

.bigc{width:min(96%,380px);height:270px;margin:2px auto}.bigc svg,.mini svg{width:100%;height:100%;display:block}
.sky{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:360px}.mini{width:30%;height:92px}

#castle .k.pp .f{animation:kfill .5s}@keyframes kfill{from{fill:#fff8c4}}
.kingbox{width:130px;height:162px;margin:2px auto}.kingbox.big{width:210px;height:262px}.kingbox svg{width:100%;height:100%;display:block}
.coinbox{margin:8px auto;padding:8px 14px;border-radius:14px;background:rgba(255,216,74,.18);border:2px solid #ffd84a;font-size:18px}.coinbox b{font-size:26px;color:#ffd84a}.rk{display:inline-block;margin:2px 0;padding:3px 12px;border-radius:14px;background:#f2b705;color:#3a2a00;font-weight:800}

.ratebox button{font:inherit;font-size:15px;margin:8px 4px 0;padding:8px 14px;border:0;border-radius:12px;background:#e8590c;color:#fff}.ratebox button.g{background:#8a8a8a}
.toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,20,20,.88);color:#fff;padding:9px 18px;border-radius:20px;font-size:15px;z-index:30;pointer-events:none}
.stamps{display:flex;gap:5px;justify-content:center;margin:6px 0}.stamps div{width:38px;height:46px;border-radius:9px;background:#ffffff22;border:2px dashed #ffffff55;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}.stamps div b{font-size:20px;line-height:1.1}.stamps div.on{background:#f2b705;border:2px solid #fff3b0;color:#3a2a00}
.qbig{font-size:30px;font-weight:800;margin:6px 0;word-break:break-all}.qans{font-size:26px;font-weight:800;color:#ffd84a;margin:6px 0;word-break:break-all}
#cb{position:absolute;inset:0;z-index:6;display:none;flex-direction:column;background:radial-gradient(#3b7a58,#2a5c41);border:6px solid #8b5a2b;border-radius:6px;box-shadow:inset 0 0 30px rgba(0,0,0,.4)}#cb.on{display:flex}
#cbq{flex:none;display:flex;align-items:flex-start;flex-wrap:wrap;gap:5px;padding:5px;max-height:42%;overflow:auto;justify-content:center;border-bottom:2px dashed #ffffff44}
#cbq .cq{background:#ffffff22;color:#fff;border:1px dashed #fff8;border-radius:10px;padding:3px 9px;font-weight:700;font-size:calc(16px*var(--fs,1))}#cbq .cq.t{border:2px solid #f2c94c;background:#f2c94c33}
#cv{flex:1;min-height:0;width:100%;touch-action:none;cursor:crosshair}
#cbt{flex:none;display:flex;gap:4px;padding:4px;justify-content:center;flex-wrap:wrap}#cbt button{font:inherit;font-size:13px;padding:4px 9px;border-radius:8px;border:0;background:#ffffff33;color:#fff}#cbt button.sel{background:#f2b705;color:#222}
.kpair{display:flex;gap:10px;justify-content:center;align-items:flex-end}.kcol{display:flex;flex-direction:column;align-items:center}.klab{font-size:13px;font-weight:700;margin-top:2px;color:#ffd84a}
.kpair .kingbox{width:112px;height:140px;margin:0}.kpair.big .kingbox{width:150px;height:187px}.rkreg{position:fixed;top:14px;right:62px;z-index:12;padding:7px 11px;border:0;border-radius:12px;background:#f2b705;color:#222;font-weight:800;font-size:13px;box-shadow:0 2px 8px #0006}.mrk{width:100%;max-width:300px;margin:8px auto 0;padding:6px 10px 4px;border-radius:14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,216,74,.45);cursor:pointer;text-align:left}.mrkh{font-size:13px;font-weight:800;color:#ffd84a;text-align:center;margin-bottom:2px}.mrkh small{font-weight:400;opacity:.7;font-size:10px;margin-left:4px}.hs{position:relative;width:min(96%,340px);height:272px;margin:6px auto 2px;border-radius:18px;overflow:hidden;background:linear-gradient(#27406e 0%,#6a8fc4 55%,#a9c8e8 72%);border:2px solid rgba(255,216,74,.5)}
.hs:before{content:"";position:absolute;left:12%;top:12px;width:46px;height:16px;border-radius:12px;background:rgba(255,255,255,.55);box-shadow:30px 8px 0 -3px rgba(255,255,255,.45)}
.hscastle{position:absolute;left:0;right:0;bottom:30px;height:244px}.hscastle svg{width:100%;height:100%;display:block}
.hgr{position:absolute;left:0;right:0;bottom:0;height:46px;background:linear-gradient(#5aa04a,#3c7a34)}
.hwalk{position:absolute;left:42%;bottom:8px;width:84px;height:134px;will-change:transform}
.hav{width:100%;height:100%;transform-origin:50% 100%}.hav svg{width:100%;height:100%;display:block;overflow:visible}
.hsh{position:absolute;left:12%;right:12%;bottom:-2px;height:9px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(2px)}
.hsp{position:absolute;opacity:0;font-size:15px}.hsp.s1{left:-6px;top:10px}.hsp.s2{right:-8px;top:30px}.hsp.s3{left:70px;top:-6px;font-size:12px}
.hs .avu{transform-origin:50px 100px;animation:avidle 4.2s ease-in-out infinite}
.hs .avg{transform-origin:50px 86px}.hs .avc{transform-origin:50px 58px;animation:avcape 3.4s ease-in-out infinite}
.hs.walk .avu{animation:avwalk .62s ease-in-out infinite}.hs.walk .avg{animation:avhem .62s ease-in-out infinite}

@keyframes avidle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.9px) rotate(.5deg)}}
@keyframes avwalk{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes avhem{0%,100%{transform:skewX(-1.6deg)}50%{transform:skewX(1.6deg)}}
@keyframes avstep{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.2px)}}
@keyframes avbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
@keyframes avcape{0%,100%{transform:skewX(-1.2deg)}50%{transform:skewX(2deg)}}
@keyframes avpose{0%{transform:translateY(0) rotate(0)}22%{transform:translateY(2.6px) rotate(-3deg)}70%{transform:translateY(2.6px) rotate(-3deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes avtw{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}
.cn{display:inline-block;width:1.2em;height:1.2em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#f7c21a 55%,#b87800);border:1.5px solid #8a5a00;box-shadow:inset 0 -1px 2px rgba(0,0,0,.25);vertical-align:-.22em;text-align:center;font:800 .78em/1.32em sans-serif;color:#7a4a00;font-style:normal}.cg,.cl{position:absolute;left:6px;right:96px;top:2px;bottom:0;pointer-events:none}.cg{filter:grayscale(1) brightness(.55);opacity:.28}.cl{clip-path:inset(100% 0 0 0);transition:clip-path .55s ease-out}.cl.pp{animation:clpp .5s}.cl.cr{animation:clcr .45s}.cg svg,.cl svg{width:100%;height:100%;display:block}
@keyframes clpp{0%{filter:brightness(1.7)}100%{filter:none}}@keyframes clcr{0%,100%{transform:translateX(0)}20%{transform:translateX(-3px);filter:sepia(1) saturate(4) hue-rotate(-30deg)}50%{transform:translateX(3px)}80%{transform:translateX(-2px)}}
.cfl{transform-box:fill-box;transform-origin:left center;animation:cwave 1.1s ease-in-out infinite alternate}@keyframes cwave{from{transform:skewY(-6deg) scaleX(.92)}to{transform:skewY(6deg) scaleX(1.05)}}

.cwv{animation:cwv 2.4s ease-in-out infinite alternate}@keyframes cwv{from{transform:translateX(-4px)}to{transform:translateX(4px)}}
