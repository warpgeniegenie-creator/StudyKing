function cleanAv(a){const T={head:HEAD,body:BODYMAP,cape:CAPE,hand:HAND,neck:NECK,face:FACE,hair:HCOL,shoe:SHOEC,skin:SKINC,height:HGT,build:BLD},e={};a=a||{};const q=a.eq||{};
 for(const k in T)if(typeof q[k]=='string'&&Object.prototype.hasOwnProperty.call(T[k],q[k]))e[k]=q[k];
 if(AURAS.includes(q.aura))e.aura=q.aura;if(!e.body)e.body='tunic';
 return{sex:a.sex=='f'?'f':'m',eq:e}}
let FB=null;
async function fbInit(){if(FB)return FB;if(!FBCFG.apiKey)throw new Error('nocfg');
 const B='https://www.gstatic.com/firebasejs/10.12.2/';
 const [A,AU,FS]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
 const app=A.initializeApp(FBCFG),auth=AU.getAuth(app);let db;try{db=FS.initializeFirestore(app,{experimentalAutoDetectLongPolling:true})}catch(e){db=FS.getFirestore(app)}
 const uid=(auth.currentUser||(await AU.signInAnonymously(auth)).user).uid;
 FB={uid,
  async put(d){await FS.setDoc(FS.doc(db,'rankings',uid),Object.assign({t:FS.serverTimestamp()},d))},
  watch(n,cb,err){return FS.onSnapshot(FS.query(FS.collection(db,'rankings'),FS.orderBy('score','desc'),FS.limit(n)),q=>cb(q.docs.map(x=>Object.assign({id:x.id},x.data()))),err||(()=>{}))},
  async top(n){const r=await FS.getDocs(FS.query(FS.collection(db,'rankings'),FS.orderBy('score','desc'),FS.limit(n)));return r.docs.map(x=>Object.assign({id:x.id},x.data()))}};
 return FB}

function miniRank(){const b=$('mrk'),l=$('mrkl');if(!b||!l)return;b.style.display='block';if(!FBCFG.apiKey){l.innerHTML='<div class="mmsg">랭킹 서버가 아직 설정되지 않았어요</div>';return}l.innerHTML='<div class="mmsg">불러오는 중… ⏳</div>';rankWatch(5,(L,uid)=>{const l=$('mrkl');if(!l)return;l.innerHTML=L.length?L.map((r,i)=>miniRow(r,i,r.id==uid)).join(''):'<div class="mmsg">아직 등록한 친구가 없어요<br><b>눌러서 첫 번째로 등록해 보세요!</b></div>'},e=>{const l=$('mrkl');if(l)l.innerHTML='<div class="mmsg">'+rankErr(e)+'</div>'})}
const rankDoc=()=>({nick:RKR.nick,score:myScore(),stars:myStars(),cleared:myClears(),sex:AV.sex||'m',eq:cleanAv(AV).eq});
async function rankPush(quiet){if(!RKR.on)return;try{const f=await fbInit();await f.put(rankDoc());return 1}catch(e){if(!quiet)throw e}}
function rankRow(r,i,me){const a=cleanAv(r);return '<div class="rrow'+(me?' me':'')+'"><div class="rno">'+(i<3?['🥇','🥈','🥉'][i]:i+1)+'</div><div class="rav">'+avatarSVG(a,{lite:1})+'</div><div class="rin"><div class="rnk">'+rkEsc(String(r.nick||'').slice(0,8))+(me?' <small>(나)</small>':'')+'</div><div class="rsc">⭐ '+(+r.stars||0)+' · 클리어 '+(+r.cleared||0)+'/30</div></div><div class="rpt">'+(+r.score||0)+'<small>점</small></div></div>'}
async function rankScr(msg){const me=RKR.on;
 const bs=[];
 if(!me)bs.push(['🏆 랭킹 등록하기',()=>rankNick()]);
 else bs.push(['🔄 내 점수 올리기',async()=>{try{await rankPush();rankScr('✅ 점수를 올렸어요!')}catch(e){rankScr(rankErr(e))}}],['✏️ 닉네임 바꾸기',()=>rankNick()]);
 bs.push(['← 돌아가기',home]);
 showOv('🏆 랭킹',(msg?'<b style="color:#ffd84a">'+msg+'</b><br>':'')+'내 점수 <b>'+myScore()+'점</b> <small>(별 '+myStars()+'개 × 10)</small><br><small>'+(me?'등록된 닉네임: '+rkEsc(RKR.nick):'등록하면 내 닉네임·점수·아바타가 다른 친구들에게 보여요')+'</small>','<button class="rkreg" onclick="rankNick()">'+(me?'내 정보':'랭킹 등록')+'</button><div class="rlist" id="rl">불러오는 중… ⏳</div>',bs);
 rankWatch(30,(L,uid)=>{const el=$('rl');if(!el)return;el.innerHTML=L.length?L.map((r,i)=>rankRow(r,i,r.id==uid)).join(''):'아직 등록한 친구가 없어요. 첫 번째가 되어 보세요!'},e=>{const el=$('rl');if(el)el.innerHTML='<small>'+rankErr(e)+'</small>'})}
const rankErr=e=>{const c=(e&&(e.code||e.message))||'';
 if(c=='nocfg')return '랭킹 서버(Firebase)가 아직 설정되지 않았어요.';
 if(/operation-not-allowed|admin-restricted/.test(c))return '익명 로그인이 꺼져 있어요. Firebase 콘솔 → Authentication → 로그인 방법에서 "익명"을 켜 주세요.';
 if(/unauthorized-domain/.test(c))return '이 주소가 승인되지 않았어요. Firebase 콘솔 → Authentication → 설정 → 승인된 도메인에 이 주소를 추가해 주세요.';
 if(/permission-denied/.test(c))return '권한이 없어요. Firestore 규칙을 확인해 주세요 (읽기 허용: allow read: if true).';
 if(/failed-precondition|not-found/.test(c))return 'Firestore 데이터베이스를 찾지 못했어요. 콘솔 → Firestore에 (default) 데이터베이스가 있는지, 프로젝트 ID가 '+FBCFG.projectId+' 인지 확인해 주세요. ('+String(c).slice(0,40)+')';
 return '랭킹을 불러오지 못했어요. 인터넷 연결을 확인해 주세요. ('+String(c).slice(0,60)+')'};
